[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clara"
version = "2.0.0"
description = "Clara: a Discord bot powered by Ollama, with per-user memory, a JSONL event log and a terminal console"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "ollama>=0.4",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
clara = "clara.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
