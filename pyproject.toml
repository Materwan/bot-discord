[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ollama-bot"
version = "0.1.0"
description = "Bot Discord branché sur Ollama, avec mémoire, logs JSONL et commandes console"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "ollama>=0.4",
    "python-dotenv>=1.0",
]

[project.scripts]
discord-bot = "src.main:run"

[tool.setuptools]
packages = ["src"]
