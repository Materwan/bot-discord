[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-discord"
version = "1.0.0"
description = "Bot Discord branché sur Ollama, avec mémoire, logs JSONL et commandes console"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
bot_discord = "bot_discord.main:run"

